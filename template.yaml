AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: ReturnGuard - AI-Powered Return Window Tracker & Alert System

Parameters:
  AlertEmail:
    Type: String
    Description: Email address verified in Amazon SES to receive return deadline alerts.

Globals:
  Function:
    Timeout: 15
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        TABLE_NAME: !Ref ReturnGuardTable
        ALERT_EMAIL: !Ref AlertEmail

Resources:
  ReturnGuardTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: ReturnGuardItems
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: itemId
          KeyType: HASH

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowHeaders:
          - "*"
        AllowMethods:
          - GET
          - POST
          - OPTIONS

  SubmitItemFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: submit_item/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReturnGuardTable
        - Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
      Events:
        PostItem:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items
            Method: POST
        GetItems:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /items
            Method: GET

  CheckDeadlinesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: check_deadlines/
      Handler: app.lambda_handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ReturnGuardTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
              Resource: "*"
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: 'cron(0 9 * * ? *)'
            Name: ReturnGuardDailyCheck
            Description: Runs daily at 09:00 UTC to check for expiring return windows

Outputs:
  ApiEndpoint:
    Description: HTTP API Gateway endpoint URL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/items"